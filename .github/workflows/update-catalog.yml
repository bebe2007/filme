name: Build movie catalog data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'editorial/**'
      - '.github/workflows/update-catalog.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-catalog
  cancel-in-progress: true

jobs:
  inspect-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect upstream pagination contract
        run: |
          python - <<'PYCODE'
          import urllib.request,json,time
          for kind in ('movies','tvshows'):
              time.sleep(2)
              try:
                  req=urllib.request.Request(f'https://vsembed.ru/{kind}/latest/page-1.json',headers={'User-Agent':'Mozilla/5.0 CatalogBuilder/1.1','Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=20) as r: doc=json.load(r)
                  rows=doc.get('result') or doc.get('items') or []
                  print(json.dumps({'type':kind,'pages':doc.get('pages'),'rows':len(rows),'fields':list(rows[0]) if rows else [],'sample':[{k:v for k,v in row.items() if k in ('imdb_id','time_added','title')} for row in rows[:2]]}),flush=True)
              except Exception as exc: print(kind,str(exc),flush=True)
          PYCODE
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore verified previous-day bootstrap membership
        uses: actions/cache/restore@v4
        with:
          path: .catalog-cache/vse
          key: vse-catalog-Linux-38704274627

      - name: Retain dated bootstrap snapshot
        run: |
          mkdir -p .catalog-work/bootstrap-previous-day
          if [ -f .catalog-cache/vse/movie_imdb.txt ] && [ -f .catalog-cache/vse/tv_imdb.txt ]; then
            cp .catalog-cache/vse/movie_imdb.txt .catalog-cache/vse/tv_imdb.txt .catalog-work/bootstrap-previous-day/
            printf '%s' '{"catalog_date":"2026-10-15","source_run":38704274627}' > .catalog-work/bootstrap-previous-day/manifest.json
          fi
          rm -rf .catalog-cache/vse

      - name: Restore last valid VSE ID lists
        uses: actions/cache@v4
        with:
          path: .catalog-cache/vse
          key: vse-catalog-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            vse-catalog-${{ runner.os }}-

      - name: Read currently published catalog metadata
        run: |
          mkdir -p .catalog-work
          curl --fail --silent --show-error --location --max-time 30 \
            https://bebe2007.github.io/filme/data/meta.json \
            -o .catalog-work/previous-meta.json || true

      - name: Test presentation feeds
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Build static catalog
        env:
          CATALOG_BASELINE_DIR: .catalog-work/bootstrap-previous-day
        run: |
          python scripts/build_catalog.py --out public/data --work .catalog-work --vse-cache .catalog-cache/vse --page-size 70
          touch public/.nojekyll

      - name: Preserve existing GitHub Pages player site
        run: |
          cp index.html public/index.html
          if [ -d actori ]; then cp -R actori public/actori; fi
          if [ -d seriale ]; then cp -R seriale public/seriale; fi

      - name: Verify generated catalog
        run: |
          test -s public/data/meta.json
          test -s public/data/movies/page-1.json
          test -s public/data/tv/page-1.json
          test -s public/data/latest/movies.json
          test -s public/data/latest/tv.json
          test -s public/data/browse/all.json
          test -s public/data/browse/movies.json
          test -s public/data/browse/tv.json
          test -s public/data/ranked/movies.json
          test -s public/data/ranked/tv.json
          test -s public/data/daily.json
          test -s public/data/people-meta.json
          test -s public/data/people-ids.txt
          test -s public/data/sync/manifest.json
          test -s public/data/provider-sync-status.json
          python - <<'PY'
          import json
          from pathlib import Path

          meta = json.loads(Path("public/data/meta.json").read_text(encoding="utf-8"))
          assert meta.get("schema_version") == 2
          assert meta["items_per_page"] == 70
          assert meta["movies"] > 0
          assert meta["tv"] > 0
          for path in ("public/data/latest/movies.json", "public/data/latest/tv.json"):
              latest = json.loads(Path(path).read_text(encoding="utf-8"))
              assert isinstance(latest.get("items"), list) and latest["items"]

          previous_path = Path(".catalog-work/previous-meta.json")
          if previous_path.exists() and previous_path.stat().st_size:
              try:
                  previous = json.loads(previous_path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"Nu pot valida meta anterior: {exc}")
              else:
                  for key in ("movies", "tv"):
                      old = int(previous.get(key) or 0)
                      new = int(meta.get(key) or 0)
                      if old >= 100 and new < old * 0.50:
                          raise AssertionError(
                              f"Catalog suspect pentru {key}: {new} vs {old} anterior (<50%). Deploy oprit."
                          )

          status = json.loads(Path("public/data/provider-sync-status.json").read_text())
          assert all(r['complete'] and not r['unresolved'] for r in status.values()), status
          assert meta['episodes'] == meta['provider_episodes']
          manifest = json.loads(Path('public/data/sync/manifest.json').read_text())
          import gzip, hashlib
          for name, item in manifest['files'].items():
              path = Path('public/data/sync')/name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item['sha256']
              with gzip.open(path,'rt') as f:
                  assert sum(1 for line in f if line.strip()) == meta['total']
          print(meta)
          print(status)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4



