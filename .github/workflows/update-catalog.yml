name: Build movie catalog data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_catalog.py'
      - '.github/workflows/update-catalog.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build static catalog
        run: |
          python scripts/build_catalog.py --out public/data --work .catalog-work --page-size 70
          touch public/.nojekyll

      - name: Verify generated catalog
        run: |
          test -s public/data/meta.json
          test -s public/data/movies/page-1.json
          test -s public/data/tv/page-1.json
          python - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path("public/data/meta.json").read_text(encoding="utf-8"))
          assert meta["items_per_page"] == 70
          assert meta["movies"] > 0
          assert meta["tv"] > 0
          print(meta)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
