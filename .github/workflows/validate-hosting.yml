name: Validate hosting synchronization
on:
  push:
    paths:
      - 'hosting/**'
      - '.github/workflows/validate-hosting.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate PHP syntax and factual date labels
        run: |
          php --version
          php -l hosting/includes/collections.php
          php -l hosting/catalog-sync.php
          php -l hosting/update-catalog.php
          php -l hosting/includes/catalog.php
          php -l hosting/includes/card.php
          php -l hosting/includes/title-view.php
          php -l hosting/includes/browse.php
          php -l hosting/includes/header.php
          php -l hosting/index.php
          php hosting/test-sync.php
          php hosting/test-collections.php
          node --check hosting/assets/js/catalog-sync-ui.js
