name: Validate hosting synchronization
on:
  push:
    paths:
      - 'hosting/**'
      - '.github/workflows/validate-hosting.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate every source file and PHP runtime behavior
        run: python scripts/validate_source.py
      - name: Test catalog and localization
        run: python -m unittest discover -s scripts -p 'test_*.py'

  localization-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify TMDb secret access without revealing credentials
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN || secrets.TMDB_READ_ACCESS_TOKEN }}
        run: python scripts/tmdb_localization.py --check
